name: Fetch Argos models
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download models
        run: |
          mkdir -p argos_models
          curl -fsSL --retry 3 -o argos_models/translate-en_ur-1_9.argosmodel \
            "https://argos-net.com/v1/translate-en_ur-1_9.argosmodel"
          curl -fsSL --retry 3 -o argos_models/translate-en_hi-1_1.argosmodel \
            "https://argos-net.com/v1/translate-en_hi-1_1.argosmodel"
          ls -la argos_models/
          # sanity: files must be zip archives (PK header)
          file argos_models/* || true
          head -c 2 argos_models/translate-en_ur-1_9.argosmodel | grep -q PK
          head -c 2 argos_models/translate-en_hi-1_1.argosmodel | grep -q PK
      - name: Push models branch
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b argos-models
          git add -f argos_models/
          git commit -m "chore: add argos en-ur and en-hi translation models"
          git push origin argos-models
          echo PUSH_OK
