name: Fetch Argos models
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download models
        run: |
          mkdir -p argos_models
          curl -fsSL --retry 3 -o argos_models/translate-en_ur-1_9.argosmodel \
            "https://argos-net.com/v1/translate-en_ur-1_9.argosmodel"
          curl -fsSL --retry 3 -o argos_models/translate-en_hi-1_1.argosmodel \
            "https://argos-net.com/v1/translate-en_hi-1_1.argosmodel"
          ls -la argos_models/
      - name: Push to argos-models branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan argos-models-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          git add -f argos_models/
          git commit -m "chore: argos translation models en-ur + en-hi"
          git push --force origin HEAD:argos-models
          echo "pushed OK"
