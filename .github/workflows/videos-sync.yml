name: Sync YouTube videos

# Regenerates public/videos/assets/videos-data.js from the live channel,
# commits it when anything changed, and Vercel auto-redeploys on push.
# If YouTube ever blocks the scrape, this run fails, nothing is committed,
# and the site keeps serving the last good snapshot — it can never "break".

on:
  schedule:
    - cron: "15 13 * * *"   # 18:15 Pakistan time, once daily (was 2x: each run = 1 production deploy)
  workflow_dispatch: {}        # "Sync now" button in the Actions tab
  push:
    branches: [main, master]
    paths:
      - "scripts/update_videos.py"   # only re-run when the scraper itself changes
      # (layout/CSS edits under public/videos no longer trigger a YouTube scrape)

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape channel + playlists from YouTube (retry on transient block)
        run: |
          for i in 1 2 3; do
            python3 scripts/update_videos.py --out public/videos/assets && exit 0
            echo "attempt $i failed — waiting before retry"; sleep $((i*60))
          done
          echo "::warning::YouTube scrape failed after 3 attempts; keeping last good snapshot."
          exit 0

      - name: Commit new data (only if changed)
        run: |
          git config user.name  "saulspodship"
          # Email MUST map to the Vercel-linked GitHub account (repo owner) or
          # Vercel blocks the deployment (Hobby plan, private repo: owner-only)
          git config user.email "saulspodship@gmail.com"
          git add public/videos/assets/videos-data.js public/videos/assets/videos-data.json
          if git diff --cached --quiet; then
            echo "No new episodes — nothing to commit."
            exit 0
          fi
          git commit -m "chore(videos): auto-sync YouTube episode data ($(date -u +%F' '%H:%M)' UTC)"
          git push
