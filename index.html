    <script>
      // The app is routed with createHashRouter (/#/route). Static hosting
      // answers any unknown path (e.g. /theological-archive from the sitemap,
      // volume-page companion buttons or an old plain <a href>) with this
      // file and an EMPTY hash, which silently lands on the home page.
      // Rewrite such deep links to their hash form before the app boots.
      (function () {
        var p = location.pathname;
        if (p && p !== '/' && p !== '/index.html' && !location.hash) {
          location.replace('/#' + p.replace(/\/+$/, '') + location.search);
        }
      })();
    </script>
    <!-- ── Boot curtain (critical, inline) ─────────────────────────────────
         The app is client-rendered, so every route's HTML ships a small
         crawler-facing pre-render block (see scripts/prerender-seo.mjs). On a
         cold load the browser paints that block — a serif list of site links
         (…FAQ…) — for a beat before React replaces it with the hero banner and
         the volume body. That flash is what made pages "load with the FAQs on
         top, then the hero image".

         This curtain is painted by the HTML parser itself (no JS, no network)
         in the splash screen's own colours, sits under the React splash
         (z-index 9998 vs 9999), and is removed the moment the app paints
         ('sp-app-ready', dispatched by AscensionSplash). Result: the first
         frame is the brand, never the pre-render shell. It also gives an
         instant first paint on slow connections instead of a white screen. -->
    <style>
      #sp-boot {
        position: fixed; inset: 0; z-index: 9998;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; padding: 24px; text-align: center;
        background: radial-gradient(120% 90% at 50% 28%, #24101C 0%, #16060F 55%, #0A0308 100%);
        color: #F8F4E3;
        font-family: Merriweather, Georgia, "Times New Roman", serif;
        -webkit-tap-highlight-color: transparent;
        pointer-events: none;
        transition: opacity .22s ease;
      }
      #sp-boot .sp-boot-mark {
        font-size: clamp(1.25rem, 1.1rem + 1.6vw, 2rem);
        font-weight: 900; letter-spacing: .16em; text-transform: uppercase; color: #E8C96A;
      }
      #sp-boot .sp-boot-line {
        width: min(210px, 54vw); height: 1px;
        background: linear-gradient(90deg, transparent, #D4AF37, transparent);
      }
      #sp-boot .sp-boot-sub {
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
        font-size: 11px; font-weight: 600; letter-spacing: .28em;
        text-transform: uppercase; color: rgba(248, 244, 227, .68);
      }
      #sp-boot .sp-boot-dot {
        width: 30px; height: 30px; border-radius: 999px; margin-top: 4px;
        border: 2px solid rgba(212, 175, 55, .28); border-top-color: #E8C96A;
        animation: spBootSpin .9s linear infinite;
      }
      @keyframes spBootSpin { to { transform: rotate(360deg); } }
      #sp-boot.sp-boot-hide { opacity: 0; }
      html.sp-booted #sp-boot { display: none !important; }
      @media (prefers-reduced-motion: reduce) {
        #sp-boot .sp-boot-dot { animation: none; }
      }
    </style>

    <script>
      // Remove the boot curtain as soon as the React splash is on screen.
      // Fallbacks (slow bundle, blocked script) keep it from ever sticking.
      (function () {
        var boot = document.getElementById('sp-boot');
        if (!boot) return;
        var removed = false;
        function clear() {
          if (removed) return;
          removed = true;
          boot.className = 'sp-boot-hide';
          setTimeout(function () {
            document.documentElement.classList.add('sp-booted');
            if (boot.parentNode) boot.parentNode.removeChild(boot);
          }, 240);
        }
        window.addEventListener('sp-app-ready', clear);
        window.addEventListener('load', function () { setTimeout(clear, 2500); });
        setTimeout(clear, 6000);
      })();
    </script>

    <script>
      // Chrome fires beforeinstallprompt very early — often before the React
      // app has mounted — so capture it here and let the app pick it up later.
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__spInstallEvt = e; window.dispatchEvent(new CustomEvent('sp-install-ready')); });
      window.addEventListener('appinstalled', function () { window.__spInstalled = true; window.__spInstallEvt = null; });
      if ('serviceWorker' in navigator && location.hostname !== 'localhost' && !location.port) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () { /* offline PWA simply stays unavailable */ });
        });
      }
    </script>
